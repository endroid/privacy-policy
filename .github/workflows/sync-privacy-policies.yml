name: Sync privacy policies

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-privacy-policies
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check access tokens
        env:
          ANDROID_DEV_READ_TOKEN: ${{ secrets.ANDROID_DEV_READ_TOKEN }}
          PRIVACY_POLICY_WRITE_TOKEN: ${{ secrets.PRIVACY_POLICY_WRITE_TOKEN }}
        run: |
          if [[ -z "$ANDROID_DEV_READ_TOKEN" || -z "$PRIVACY_POLICY_WRITE_TOKEN" ]]; then
            echo '::error::Set ANDROID_DEV_READ_TOKEN (Contents read on endroid/android-dev) and PRIVACY_POLICY_WRITE_TOKEN (Contents write on endroid/privacy-policy).'
            exit 1
          fi

      - name: Check out published policies
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          token: ${{ secrets.PRIVACY_POLICY_WRITE_TOKEN }}
          path: policies

      - name: Check out source policies
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: endroid/android-dev
          ref: main
          token: ${{ secrets.ANDROID_DEV_READ_TOKEN }}
          path: android-dev
          persist-credentials: false
          sparse-checkout: apps/*/play/privacy-policy.html
          sparse-checkout-cone-mode: false

      - name: Sync policies to the repository root
        working-directory: policies
        shell: bash
        run: |
          shopt -s nullglob
          for policy in ../android-dev/apps/*/play/privacy-policy.html; do
            game="${policy#../android-dev/apps/}"
            game="${game%%/*}"
            cp -- "$policy" "$game.html"
          done
          for policy in *.html; do
            game="${policy%.html}"
            if [[ ! -f "../android-dev/apps/$game/play/privacy-policy.html" ]]; then
              rm -- "$policy"
            fi
          done

      - name: Commit and push changes to main
        working-directory: policies
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo 'Privacy policies are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync privacy policies from android-dev'
          git push origin HEAD:main
