name: Sync privacy policies

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-privacy-policies
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check source access token
        env:
          ANDROID_DEV_READ_TOKEN: ${{ secrets.ANDROID_DEV_READ_TOKEN }}
        run: |
          if [[ -z "$ANDROID_DEV_READ_TOKEN" ]]; then
            echo '::error::Set ANDROID_DEV_READ_TOKEN to a token with Contents read access to endroid/android-dev.'
            exit 1
          fi

      - name: Check out published policies
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: policies
          persist-credentials: false

      - name: Check out source policies
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: endroid/android-dev
          ref: main
          token: ${{ secrets.ANDROID_DEV_READ_TOKEN }}
          path: android-dev
          persist-credentials: false
          sparse-checkout: apps/*/play/privacy-policy.html
          sparse-checkout-cone-mode: false

      - name: Copy policies to the repository root
        working-directory: policies
        shell: bash
        run: |
          shopt -s nullglob
          policies=(../android-dev/apps/*/play/privacy-policy.html)
          if (( ${#policies[@]} == 0 )); then
            echo '::error::No source privacy policies found.'
            exit 1
          fi
          for policy in "${policies[@]}"; do
            game="${policy#../android-dev/apps/}"
            game="${game%%/*}"
            cp -- "$policy" "$game.html"
          done

      - name: Open or update the policy sync pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          path: policies
          add-paths: ':(top,glob)*.html'
          branch: automation/sync-privacy-policies
          commit-message: Sync privacy policies from android-dev
          title: Sync privacy policies from android-dev
          body: |
            Copies `apps/<game>/play/privacy-policy.html` from `endroid/android-dev` main to `<game>.html` in this repository.

            Existing policies without a matching source are left unchanged. Review and merge to publish the updates.
